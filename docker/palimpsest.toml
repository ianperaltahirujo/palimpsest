schema = 1

# Server-only overrides for a public, hosted instance (see
# docs/deployment.md). All other sections are left at their packaged
# defaults. Paths are NOT overridden here -- WORKDIR is /app in the
# image, so the default relative paths (.palimpsest/work, etc.) resolve
# to /app/.palimpsest/... automatically. There is no persistent volume
# on Render's free tier, so none of this survives a restart -- an
# accepted tradeoff (see docs/deployment.md), not a bug.

[limits]
# Tighter than the packaged default (50 MB) -- a public host with no
# billing relationship to its visitors has less reason to accept as
# large an upload as a local single-user install does. Raise this if
# you're hosting for known/trusted visitors instead.
max_upload_bytes = 20971520          # 20 MB
max_concurrent_jobs_per_visitor = 1

[ocr]
# A real 3-page scan OOM-killed this instance (Render free tier, 512MB)
# before this was set: ocrmypdf's own default is to run one worker
# process PER CPU CORE THE HOST REPORTS, each holding a full page raster
# buffer, and Render's shared host can report more cores than this
# tier's actual memory allocation can back. See docs/deployment.md and
# config.model.OcrConfig.jobs.
jobs = 1
