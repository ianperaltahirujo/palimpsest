name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # scrub_check --history needs full log

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (dev)
        run: pip install -e ".[dev,anthropic,server]"

      - name: Ruff lint
        run: ruff check .

      - name: Mypy (typed core only)
        run: mypy

      - name: Pytest (no network, no OCR)
        run: pytest

      - name: De-identification scan
        run: python tools/scrub_check.py --history
        env:
          PALIMPSEST_DENYLIST: ${{ secrets.PALIMPSEST_DENYLIST_PATH || '' }}

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/prototype
    steps:
      - uses: actions/checkout@v5

      # node-version-file (not a hardcoded "20") so the Node version lives
      # in exactly one place (web/prototype/.nvmrc) -- a hardcoded pin here
      # silently drifted from what jsdom/undici actually require and this
      # job failed on Node 20 for a while before anyone noticed (jsdom 30 ->
      # undici 8 both declare engines that exclude Node 20; npm ci only
      # warns on EBADENGINE, so install succeeds and the failure only
      # surfaces inside the vitest worker at test time).
      - uses: actions/setup-node@v5
        with:
          node-version-file: web/prototype/.nvmrc
          cache: "npm"
          cache-dependency-path: web/prototype/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build (production, real-mode default)
        run: npm run build

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    # Builds and smoke-tests the deployment image (see Dockerfile,
    # docs/deployment.md) on every push -- this is real verification that
    # local Docker unavailability in dev can't provide, and it catches a
    # broken Dockerfile the moment it happens, not the next time someone
    # tries to actually deploy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t palimpsest-server .

      - name: Run container and wait for /api/health
        run: |
          docker run -d --name palimpsest -p 8765:8765 palimpsest-server
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8765/api/health > /dev/null; then
              echo "health check passed"
              exit 0
            fi
            sleep 1
          done
          echo "server never became healthy -- container logs:"
          docker logs palimpsest
          exit 1

      - name: Container logs (always, for debugging)
        if: always()
        run: docker logs palimpsest
