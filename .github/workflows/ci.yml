name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scrub_check --history needs full log

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (dev)
        run: pip install -e ".[dev,anthropic,server]"

      - name: Ruff lint
        run: ruff check .

      - name: Mypy (typed core only)
        run: mypy

      - name: Pytest (no network, no OCR)
        run: pytest

      - name: De-identification scan
        run: python tools/scrub_check.py --history
        env:
          PALIMPSEST_DENYLIST: ${{ secrets.PALIMPSEST_DENYLIST_PATH || '' }}

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/prototype
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/prototype/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build (production, real-mode default)
        run: npm run build

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
