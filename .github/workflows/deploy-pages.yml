name: Deploy Pages

on:
  push:
    branches: [main]
    paths: [web/prototype/**, .github/workflows/deploy-pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/prototype
    steps:
      - uses: actions/checkout@v5

      # node-version-file, not a hardcoded version -- see ci.yml's matching
      # comment for why (jsdom/undici's engine ranges exclude Node 20;
      # web/prototype/.nvmrc is the single place this is pinned).
      - uses: actions/setup-node@v5
        with:
          node-version-file: web/prototype/.nvmrc
          cache: "npm"
          cache-dependency-path: web/prototype/package-lock.json

      - name: Install dependencies
        run: npm ci

      # VITE_STANDALONE=1 switches config.js's API-base default to
      # http://127.0.0.1:8765 (the CLI's own --port default) instead of
      # "" (same-origin) -- this build has no API of its own, every
      # visitor points it at their own locally-running `palimpsest
      # serve`. VITE_MOCK must stay unset: this is a real build, not the
      # design-review fixture mode.
      - name: Build (standalone, real mode)
        run: npm run build
        env:
          VITE_STANDALONE: "1"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/prototype/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
