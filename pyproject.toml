[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "palimpsest-translate"
version = "0.1.0.dev0"
description = "Layout-preserving document translation: same pages, same artwork, same typography -- only the words change."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Ian Peralta" }]
keywords = ["translation", "pdf", "ocr", "ooxml", "document-processing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Linguistic",
]

dependencies = [
  "pymupdf>=1.26,<2",
  "deep-translator>=1.11,<2",
  "lxml>=5.0",
  "numpy>=1.26",
  "pillow>=10.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
ocr = ["ocrmypdf>=16.0"]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10",
]
all = ["palimpsest-translate[anthropic,ocr]"]

[project.scripts]
palimpsest = "palimpsest.cli:main"

# [project.urls]
# Filled in once the GitHub repo is created (gh repo create) -- not guessing
# the account/org name here.
# Homepage = "https://github.com/<owner>/palimpsest"
# Issues = "https://github.com/<owner>/palimpsest/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/palimpsest"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
# Grows to include src/palimpsest/{text,config} in PR2-3 and
# translate/backend.py in PR5. Kept to the package root for now so CI has
# something real to check without referencing modules that don't exist yet.
files = ["src/palimpsest/__init__.py", "src/palimpsest/cli.py"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "ocr: requires a real Tesseract/ocrmypdf install",
  "network: makes a real network call (never run in CI)",
]
addopts = "-m \"not ocr and not network\""
