[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "palimpsest-translate"
version = "0.1.0"
description = "Layout-preserving document translation: same pages, same artwork, same typography -- only the words change."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Ian Peralta" }]
keywords = ["translation", "pdf", "ocr", "ooxml", "document-processing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Linguistic",
]

dependencies = [
  "pymupdf>=1.26,<2",
  "deep-translator>=1.11,<2",
  "lxml>=5.0",
  "numpy>=1.26",
  "pillow>=10.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
gemini = ["google-genai>=1.0"]
ocr = ["ocrmypdf>=16.0"]
server = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "httpx>=0.27",
]
all = ["palimpsest-translate[anthropic,gemini,ocr,server]"]

[project.scripts]
palimpsest = "palimpsest.cli:main"

[project.urls]
Homepage = "https://github.com/ianperaltahirujo/palimpsest"
Issues = "https://github.com/ianperaltahirujo/palimpsest/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/palimpsest"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "UP031",  # "{%s}tag" % NS Clark-notation is idiomatic in lxml/ElementTree code
]

[tool.ruff.lint.per-file-ignores]
# Fixture files carry literal OOXML/long descriptive strings that shouldn't
# be wrapped -- wrapping would either break the XML or hurt readability.
"tests/unit/test_ooxml.py" = ["E501"]
"tests/unit/test_office_pipeline.py" = ["E501"]
# pytest.importorskip("anthropic") / pytest.importorskip("google.genai")
# must run before importing anything that transitively imports the
# optional package, so the module-level imports below them are
# deliberate, not an ordering mistake.
"tests/unit/test_anthropic_backend.py" = ["E402"]
"tests/unit/test_gemini_backend.py" = ["E402"]

[tool.mypy]
# Not a floor on runtime support (that's [project].requires-python, ">=3.11",
# enforced for real by every matrix Python actually running pytest) -- this
# only controls the syntax dialect mypy parses, including third-party .pyi
# stubs. numpy's own bundled stub (as resolved on Python 3.12/3.13 runners)
# uses a PEP 695 `type` statement unconditionally, which mypy can only parse
# at python_version >= "3.12"; pinning "3.11" here made mypy fail to even
# read that file on those runners, before checking a single line of our own
# code. A stale 3.12-only-syntax accident in OUR source would still be
# caught for real by the 3.11 pytest job's actual interpreter.
python_version = "3.12"
files = [
  "src/palimpsest/__init__.py",
  "src/palimpsest/cli.py",
  "src/palimpsest/corpus.py",
  "src/palimpsest/core",
  "src/palimpsest/text",
  "src/palimpsest/config",
  "src/palimpsest/translate",
  "src/palimpsest/qa",
  "src/palimpsest/pdf/classify.py",
  "src/palimpsest/pdf/ocr.py",
  "src/palimpsest/pdf/pipeline.py",
  "src/palimpsest/office/pipeline.py",
  "src/palimpsest/server",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so `from tests.fixtures.synth import ...` resolves
markers = [
  "ocr: requires a real Tesseract/ocrmypdf install",
  "network: makes a real network call (never run in CI)",
]
addopts = "-m \"not ocr and not network\""
